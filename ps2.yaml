    include_dirs: [modules/network/udpfs_ministack/src, modules/network/udpfs_ministack/include, modules/network/udpfs_smap/include]
    headers: *iop_headers
    cflags: [-mno-check-zero-division]
    imports_lst: modules/network/udpfs_ministack/src/imports.lst
    exports_tab: modules/network/udpfs_ministack/src/exports.tab

  - name: udpfs_bd
    type: iop
    sources: [modules/network/udpfs_bd/src/main.c, modules/network/udpfs_bd/src/udprdma.c, modules/network/udpfs_bd/src/udpfs_core.c, modules/network/udpfs_bd/src/udpfs_bd.c]
    include_dirs: [modules/network/udpfs_bd/src, modules/network/udpfs_bd/include, modules/network/udpfs_smap/include, modules/network/udpfs_ministack/include]
    headers: *iop_headers
    defines: [FEATURE_UDPFS_BD, UDPRDMA_MAX_SOCKETS=1]
    cflags: [-mno-check-zero-division]
    imports_lst: modules/network/udpfs_bd/src/imports.lst
    exports_tab: modules/network/udpfs_bd/src/exports.tab

  - name: udpfs_ioman
    type: iop
    sources: [modules/network/udpfs_ioman/src/main.c, modules/network/udpfs_ioman/src/udprdma.c, modules/network/udpfs_ioman/src/udpfs_core.c, modules/network/udpfs_ioman/src/udpfs_ioman.c]
    include_dirs: [modules/network/udpfs_ioman/src, modules/network/udpfs_ioman/include, modules/network/udpfs_smap/include, modules/network/udpfs_ministack/include]
    headers: *iop_headers
    defines: [FEATURE_UDPFS_IOMAN, UDPRDMA_MAX_SOCKETS=1]
    cflags: [-mno-check-zero-division]
    imports_lst: modules/network/udpfs_ioman/src/imports.lst
    exports_tab: modules/network/udpfs_ioman/src/exports.tab

  # FORK-VENDORED atad (retryable sceAtaInit). Embedded as ps2atad_irx.
  - name: ata_bd
    type: iop
    sources: [modules/hdd/atad/src/ps2atad.c]
    include_dirs: [modules/hdd/atad/src]
    headers: *iop_headers
    defines: [ATA_USE_DEV9=1, ATA_GAMESTAR_WORKAROUND=1, ATA_ENABLE_BDM=1]
    imports_lst: modules/hdd/atad/src/imports.lst
    exports_tab: modules/hdd/atad/src/exports.tab

  # FORK-VENDORED APA driver. Embedded as ps2hdd_irx.
  - name: ps2hdd_osd
    type: iop
    sources: [modules/hdd/apa/src/hdd_fio.c, modules/hdd/apa/src/hdd_blkio.c, modules/hdd/apa/src/hdd.c, modules/hdd/apa/src/password.c, modules/hdd/apa/src/misc.c, modules/hdd/apa/src/cache.c, modules/hdd/apa/src/apa.c, modules/hdd/apa/src/journal.c, modules/hdd/apa/src/free.c, modules/hdd/apa/src/table_fence.c]
    include_dirs: [modules/hdd/apa/src]
    headers: *iop_headers
    defines: [APA_OSD_VER, APA_USE_DEV9, APA_USE_ATAD, IOMANX_OLD_NAME_COMPATIBILITY=0, IOMANX_OLD_NAME_ADDDELDRV=0]
    imports_lst: modules/hdd/apa/src/imports.lst

  # FORK-VENDORED BDM (block-cache refill fix); links the vendored libbdm below.
  - name: bdm_drv
    type: iop
    sources: [modules/bdm/src/main.c, modules/bdm/src/bdm.c, modules/bdm/src/part_driver.c, modules/bdm/src/part_driver_mbr.c, modules/bdm/src/part_driver_gpt.c]
    include_dirs: [modules/bdm/src, modules/bdm/src/include, modules/bdm/libbdm/include]
    headers: *iop_headers
    libs: [bdm_fork, gcc]
    imports_lst: modules/bdm/src/imports.lst
    exports_tab: modules/bdm/src/exports.tab

  # The SDK's bdmfs_fatfs at its pinned revision, plus the guarded FAT-chain walker and the
  # contiguous VMC reservation API (modules/bdm/bdmfs_fatfs/ORIGIN.txt).
  - name: bdmfs_fatfs_fork
    type: iop
    sources: [modules/bdm/bdmfs_fatfs/src/main.c, modules/bdm/bdmfs_fatfs/src/fs_driver.c, modules/bdm/bdmfs_fatfs/fatfs/diskio.c, modules/bdm/bdmfs_fatfs/fatfs/ff.c, modules/bdm/bdmfs_fatfs/fatfs/ffsystem.c, modules/bdm/bdmfs_fatfs/fatfs/ffunicode.c]
    include_dirs: [modules/bdm/bdmfs_fatfs/src, modules/bdm/bdmfs_fatfs/src/include, modules/bdm/bdmfs_fatfs/fatfs/include, modules/vmc/genvmc]
    headers: *iop_headers
    libs: [gcc]
    imports_lst: modules/bdm/bdmfs_fatfs/src/imports.lst

  # ps2sdk's i.LINK manager and block-device driver with RiptOPL's transaction-ownership, post-reset
  # login and readiness fixes (modules/ilink/*/ORIGIN.txt). The menu and the Neutrino bundle load
  # these instead of the SDK builds.
  - name: iLinkman_fork
    type: iop
    sources: [modules/ilink/iLinkman/src/iLink.c, modules/ilink/iLinkman/src/iLink_PHY.c, modules/ilink/iLinkman/src/iLink_internal.c, modules/ilink/iLinkman/src/iLink_crom.c, modules/ilink/iLinkman/src/iLink_intr.c, modules/ilink/iLinkman/src/iLink_TxRx.c, modules/ilink/iLinkman/src/iLink_DMA.c]
    include_dirs: [modules/ilink/iLinkman/include, modules/ilink/iLinkman/src/include, modules/ilink/iLinkman/src]
    headers: *iop_headers
    cflags: [-mno-check-zero-division]
    imports_lst: modules/ilink/iLinkman/src/imports.lst
    exports_tab: modules/ilink/iLinkman/src/exports.tab

  - name: IEEE1394_bd_mini_fork
    type: iop
    sources: [modules/ilink/IEEE1394_bd/src/sbp2_driver.c, modules/ilink/IEEE1394_bd/src/main.c, modules/ilink/IEEE1394_bd/src/scsi.c]
    include_dirs: [modules/ilink/IEEE1394_bd/src, modules/ilink/IEEE1394_bd/src/include, modules/ilink/iLinkman/include]
    headers: *iop_headers
    defines: [MINI_DRIVER]
    cflags: [-mno-check-zero-division]
    libs: [gcc]
    imports_lst: modules/ilink/IEEE1394_bd/src/imports.lst

  # ps2-mmce's menu driver with RiptOPL's end-of-directory, handle-release and ENOENT fixes
  # (modules/mmce/mmceman/ORIGIN.txt). Loaded instead of the ps2build mmceman package.
  - name: mmceman_fork
    type: iop
    sources: [modules/mmce/mmceman/src/ioplib.c, modules/mmce/mmceman/src/sio2man_hook.c, modules/mmce/mmceman/src/mmce_sio2.c, modules/mmce/mmceman/src/mmce_cmds.c, modules/mmce/mmceman/src/mmce_fs.c, modules/mmce/mmceman/src/mmceman.c]
    include_dirs: [modules/mmce/mmceman/include]
    headers: *iop_headers
    defines: [IOMANX_OLD_NAME_COMPATIBILITY=0, IOMANX_OLD_NAME_ADDDELDRV=0]
    imports_lst: modules/mmce/mmceman/src/imports.lst

  - name: bdm_fork
    type: iop_lib
    sources: [modules/bdm/libbdm/src/bd_defrag.c, modules/bdm/libbdm/src/bd_cache.c]
    include_dirs: [modules/bdm/libbdm/src/include, modules/bdm/libbdm/include]
    headers: *iop_headers

  # FORK-VENDORED usbd_mini (pre-2024-09-04 driver). Do NOT use the SDK usbd_mini package.
  # -G0, not the original Makefile's IOP_PREFER_GPOPT=16384: with USE_GP_REGISTER=0, -G16384 made RegisterLdd fail and ds34usb_init() spin forever.
  - name: usbd_mini_fork
    type: iop
    sources: [modules/usb/usbd-ra/src/hcd.c, modules/usb/usbd-ra/src/hub.c, modules/usb/usbd-ra/src/interface.c, modules/usb/usbd-ra/src/mem.c, modules/usb/usbd-ra/src/usbd.c, modules/usb/usbd-ra/src/usbio.c, modules/usb/usbd-ra/src/driver.c]
    include_dirs: [modules/usb/usbd-ra/src, modules/usb/usbd-ra/include]
    headers: *iop_headers
    defines: [MINI_DRIVER, USE_GP_REGISTER=0]
    cflags: [-G0]
    imports_lst: modules/usb/usbd-ra/src/imports.lst
    exports_tab: modules/usb/usbd-ra/src/exports.tab

