    include_dirs: [modules/iopcore/cdvdman/, modules/iopcore/common]
    headers: *iop_headers
    defines: [HDD_DRIVER, __USE_DEV9]
    imports_lst: modules/iopcore/cdvdman/imports.lst
    exports_tab: modules/iopcore/cdvdman/exports.tab

