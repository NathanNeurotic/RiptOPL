    include_dirs: [modules/iopcore/cdvdman/, modules/iopcore/common]
    headers: *iop_headers
    defines: [HDD_DRIVER, HD_PRO]
    imports_lst: modules/iopcore/cdvdman/imports.lst
    exports_tab: modules/iopcore/cdvdman/exports.tab

  - name: smb_cdvdman
    type: iop
    sources: [modules/iopcore/cdvdman/cdvdman.c, modules/iopcore/cdvdman/ioops.c, modules/iopcore/cdvdman/ncmd.c, modules/iopcore/cdvdman/scmd.c, modules/iopcore/cdvdman/searchfile.c, modules/iopcore/cdvdman/streaming.c, modules/iopcore/cdvdman/ioplib_util.c, modules/iopcore/cdvdman/smsutils.S, modules/iopcore/cdvdman/device-smb.c, modules/iopcore/cdvdman/smb.c, modules/iopcore/cdvdman/dev9.c, modules/isofs/zso.c, modules/isofs/lz4.c]
    include_dirs: [modules/iopcore/cdvdman/, modules/iopcore/common, modules/network/common]
    headers: *iop_headers
    defines: [SMB_DRIVER, __USE_DEV9]
    imports_lst: modules/iopcore/cdvdman/imports.lst
    exports_tab: modules/iopcore/cdvdman/exports.tab

  - name: http_cdvdman
    type: iop
    sources: [modules/iopcore/cdvdman/cdvdman.c, modules/iopcore/cdvdman/ioops.c, modules/iopcore/cdvdman/ncmd.c, modules/iopcore/cdvdman/scmd.c, modules/iopcore/cdvdman/searchfile.c, modules/iopcore/cdvdman/streaming.c, modules/iopcore/cdvdman/ioplib_util.c, modules/iopcore/cdvdman/smsutils.S, modules/iopcore/cdvdman/device-http.c, modules/iopcore/cdvdman/dev9.c, modules/isofs/zso.c, modules/isofs/lz4.c]
    include_dirs: [modules/iopcore/cdvdman/, modules/iopcore/common, modules/network/common]
