    imports_lst: modules/debug/udptty-ingame/imports.lst
    exports_tab: modules/debug/udptty-ingame/exports.tab

  # FORK-VENDORED ps2ips (RA fixes) - shadows the SDK ps2ips package; do not use the package.
  - name: ps2ips_fork
    type: iop
    sources: [modules/network/ps2ips/ps2ips.c]
    include_dirs: [modules/network/ps2ips/]
    headers: *iop_headers
    defines: [PS2IP_DNS]
    imports_lst: modules/network/ps2ips/imports.lst

  # smbman: ps2sdk's smbman with marked changes (the held-file fallback, and a write that counts only
  # the bytes the server's WRITE_ANDX Count says it stored). Every edition embeds it, not the SDK copy.
  - name: smbman_ra
    type: iop
    sources: [modules/network/smbman-ra/smbman.c, modules/network/smbman-ra/smb_fio.c, modules/network/smbman-ra/smb.c, modules/network/smbman-ra/poll.c, modules/network/smbman-ra/auth.c, modules/network/smbman-ra/des.c, modules/network/smbman-ra/md4.c]
    include_dirs: [modules/network/smbman-ra/]
    headers: *iop_headers
    libs: [gcc]
    imports_lst: modules/network/smbman-ra/imports.lst

  - name: smap_ingame
    type: iop
    sources: [modules/network/smap-ingame/main.c, modules/network/smap-ingame/smap.c, modules/network/smap-ingame/xfer.c]
    include_dirs: [modules/network/smap-ingame/, modules/iopcore/common, modules/network/common]
    headers: *iop_headers
    imports_lst: modules/network/smap-ingame/imports.lst

  - name: SMSTCPIP
    type: iop
    sources: [modules/network/SMSTCPIP/ps2ip.c, modules/network/SMSTCPIP/inet.S, modules/network/SMSTCPIP/ip.c, modules/network/SMSTCPIP/ip_addr.c, modules/network/SMSTCPIP/ip_frag.c, modules/network/SMSTCPIP/etharp.c, modules/network/SMSTCPIP/tcp_in.c, modules/network/SMSTCPIP/tcp_out.c, modules/network/SMSTCPIP/tcp.c, modules/network/SMSTCPIP/tcpip.c, modules/network/SMSTCPIP/mem.c, modules/network/SMSTCPIP/api_lib.c, modules/network/SMSTCPIP/api_msg.c, modules/network/SMSTCPIP/sockets.c, modules/network/SMSTCPIP/netif.c, modules/network/SMSTCPIP/udp.c, modules/network/SMSTCPIP/memp.c, modules/network/SMSTCPIP/icmp.c, modules/network/SMSTCPIP/pbuf.c, modules/network/SMSTCPIP/timers.c]
    include_dirs: [modules/network/SMSTCPIP/, modules/network/SMSTCPIP/include, modules/iopcore/common]
    headers: *iop_headers
    defines: [LWIP_NOASSERT, INGAME_DRIVER, INTERRUPT_CTX_INPKT]
    cflags: [-mno-memcpy, -Wno-attributes, -Wno-array-bounds, -Wno-unused-but-set-variable]
    imports_lst: modules/network/SMSTCPIP/imports.lst
    exports_tab: modules/network/SMSTCPIP/exports.tab

  # lwNBD (downloaded + pinned by the asset script into modules/network/lwNBD; gitignored)
  - name: lwnbdsvr
    type: iop
    sources: [modules/network/lwNBD/ports/playstation2/lwnbd_irx.c, modules/network/lwNBD/ports/playstation2/exports.c, modules/network/lwNBD/ports/playstation2/imports.c, modules/network/lwNBD/src/servers.c, modules/network/lwNBD/src/plugins.c, modules/network/lwNBD/src/contexts.c, modules/network/lwNBD/servers/nbd/protocol-handshake.c, modules/network/lwNBD/servers/nbd/protocol.c, modules/network/lwNBD/servers/nbd/nbd.c, modules/network/lwNBD/servers/nbd/tcp.c, modules/network/lwNBD/plugins/memory/memory.c, modules/network/lwNBD/plugins/atad/atad_d.c, modules/network/lwNBD/plugins/mcman/mcman_d.c]
    include_dirs: [modules/network/lwNBD/, modules/network/lwNBD/ports/playstation2, modules/network/lwNBD/include]
    headers: *iop_headers
    defines: ['APP_NAME=\"lwnbdsvr\"']
    cflags: [-include, ps2sdk-compat.h]
    libs: [gcc]

  - name: smap_udpbd
    type: iop
    sources: [modules/network/smap_udpbd/src/main.c, modules/network/smap_udpbd/src/smap.c, modules/network/smap_udpbd/src/xfer.c, modules/network/smap_udpbd/src/ministack.c, modules/network/smap_udpbd/src/udpbd.c, modules/network/smap_udpbd/src/udptty.c]
    include_dirs: [modules/network/smap_udpbd/src, modules/network/smap_udpbd/src/include]
    headers: *iop_headers
    cflags: [-mno-check-zero-division]
    imports_lst: modules/network/smap_udpbd/src/imports.lst
    exports_tab: modules/network/smap_udpbd/src/exports.tab

  - name: udpfs_smap
    type: iop
    sources: [modules/network/udpfs_smap/src/main.c, modules/network/udpfs_smap/src/smap.c, modules/network/udpfs_smap/src/xfer.c]
    include_dirs: [modules/network/udpfs_smap/src, modules/network/udpfs_smap/include]
    headers: *iop_headers
    cflags: [-mno-check-zero-division]
