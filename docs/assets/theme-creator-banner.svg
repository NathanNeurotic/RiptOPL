<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-labelledby="t d">
  <title id="t">RiptOPL Theme Creator</title>
  <desc id="d">Make your own RiptOPL theme in the browser: live preview of every screen, your own pictures and fonts, and a ready-to-use thm_Name.tar. Click to open the Theme Creator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.55" stop-color="#141414"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4baf92"/>
      <stop offset="0.33" stop-color="#c87e87"/>
      <stop offset="0.66" stop-color="#7f9ac8"/>
      <stop offset="1" stop-color="#c386b6"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f9ac8"/>
      <stop offset="1" stop-color="#c386b6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b4a"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="2" y="2" width="1276" height="216" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="220" fill="url(#bg)"/>
    <rect width="1280" height="220" fill="url(#grid)"/>
    <!-- soft glows in the PS button colours -->
    <circle cx="120" cy="40" r="160" fill="#7f9ac8" opacity="0.10"/>
    <circle cx="1180" cy="210" r="170" fill="#c386b6" opacity="0.09"/>
    <rect x="0" y="0" width="1280" height="4" fill="url(#rim)"/>
  </g>
  <rect x="2" y="2" width="1276" height="216" rx="18" fill="none" stroke="#444444"/>

  <!-- a little TV with a theme being laid out -->
  <g transform="translate(46 36)">
    <rect x="0" y="0" width="236" height="148" rx="14" fill="#0b0b0b" stroke="#555" stroke-width="2"/>
    <rect x="12" y="12" width="212" height="124" rx="6" fill="url(#screen)"/>
    <rect x="24" y="26" width="84" height="8" rx="3" fill="#b0b0b0" opacity="0.85"/>
    <rect x="24" y="42" width="70" height="6" rx="3" fill="#7f9ac8"/>
    <rect x="24" y="54" width="78" height="6" rx="3" fill="#b0b0b0" opacity="0.55"/>
    <rect x="24" y="66" width="62" height="6" rx="3" fill="#b0b0b0" opacity="0.55"/>
    <rect x="24" y="78" width="74" height="6" rx="3" fill="#b0b0b0" opacity="0.55"/>
    <rect x="136" y="26" width="70" height="96" rx="4" fill="#2a3a62" stroke="#7f9ac8" stroke-width="2"/>
    <rect x="146" y="38" width="50" height="50" rx="25" fill="#c386b6" opacity="0.55"/>
    <rect x="24" y="106" width="92" height="14" rx="7" fill="#000" opacity="0.35"/>
    <!-- selection marquee + cursor, the editor at work -->
    <rect x="131" y="21" width="80" height="106" rx="6" fill="none" stroke="#4baf92" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M205 112 l18 6 -8 3 6 9 -4 3 -6 -9 -6 6z" fill="#f0f0f0" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="96" y="148" width="44" height="10" rx="3" fill="#333"/>
  </g>

  <!-- PS button glyphs -->
  <g transform="translate(330 46)" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2 L26 22 L2 22 Z" stroke="#4baf92"/>
    <circle cx="50" cy="13" r="11" stroke="#c87e87"/>
    <path d="M78 3 L98 23 M98 3 L78 23" stroke="#7f9ac8"/>
    <rect x="114" y="3" width="20" height="20" rx="2" stroke="#c386b6"/>
  </g>
  <text x="478" y="66" fill="#888888" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">NEW · FREE · IN YOUR BROWSER</text>

  <text x="328" y="118" fill="#f0f0f0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">RiptOPL Theme Creator</text>
  <text x="330" y="152" fill="#b0b0b0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20">Design your own theme with a live preview of every screen,</text>
  <text x="330" y="180" fill="#b0b0b0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20">your pictures and fonts, then download a ready-to-use thm_&lt;Name&gt;.tar.</text>

  <!-- call to action -->
  <g transform="translate(1000 82)">
    <rect x="0" y="0" width="240" height="56" rx="28" fill="url(#cta)"/>
    <rect x="0" y="0" width="240" height="56" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="120" y="36" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800">Open the Creator →</text>
  </g>
</svg>
