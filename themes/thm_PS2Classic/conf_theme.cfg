# PS2 Classic: a light disc-browser look. One 256x256 8-bit background (glass panels, towers, spotlight stage) (ps2bg.png), everything else is
# OPL's built-in art and text, so it adds almost nothing to texture memory. Laid out on the 640x480
# canvas; hd_autofit keeps the 4:3 proportions in 16:9, 720p and 1080i.
# Original art by this project; no Sony artwork is used.
use_default=1
hd_autofit=1
bg_color=#05123a
text_color=#a8c0e8
ui_text_color=#ffffff
sel_text_color=#6ee1ff
