name: ps2build-configurations

on:
  push:
    branches: [rebuild/main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configurations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target.edition }} / ${{ matrix.target.configuration }} / ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        toolchain: [gcc, llvm]
        target:
          - {edition: korium, configuration: pademu0}
          - {edition: korium, configuration: ds5}
          - {edition: korium, configuration: extras}
          - {edition: korium, configuration: extras_ds5}
          - {edition: korium, configuration: dtl}
          - {edition: korium, configuration: diag}
          - {edition: korium, configuration: debug}
          - {edition: korium, configuration: debug_uart}
          - {edition: korium, configuration: ingame_debug}
          - {edition: korium, configuration: iopcore_debug}
          - {edition: korium, configuration: eesio_debug}
          - {edition: korium, configuration: ingame_debug_uart}
          - {edition: korium, configuration: iopcore_debug_uart}
          - {edition: korium, configuration: ingamediag}
          - {edition: ra, configuration: pademu0}
          - {edition: ra, configuration: ingame_debug}
          - {edition: incebtion, configuration: extras_ds5}
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # The newest ps2build SDK: the latest versions come from git.techwritescode.dev's release API (or,
      # when it is down, the newest NathanNeurotic/ps2build-mirror release). The SDK cached under them is
      # restored, else an older cached SDK is updated in place, else it is installed; then it is cached. A
      # mirror fallback older than the latest is never cached under the latest versions.
      - name: Resolve the latest ps2build SDK
        id: sdk
        run: sh tools/ps2build_sdk.sh --resolve ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-
      - name: Install the ps2build SDK
        run: sh tools/ps2build_sdk.sh ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$PS2BUILD_HOME"
      - name: Install matching ports and prepare assets
        run: |
          sh tools/install_ps2build.sh
          python tools/assets.py fetch
          python tools/assets.py lang
      - name: Cache the ps2build SDK
        if: ${{ steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
      - name: Build configuration candidate
        shell: bash
        run: |
          mkdir -p build
          python tools/build_edition.py '${{ matrix.target.edition }}' --configuration '${{ matrix.target.configuration }}' --toolchain '${{ matrix.toolchain }}' 2>&1 | tee build/configuration.log
      - name: Retain configuration candidate and provenance
        uses: actions/upload-artifact@v4
        with:
          name: configuration-${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ matrix.toolchain }}
          path: dist/configurations/${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ matrix.toolchain }}/
          if-no-files-found: error
          retention-days: 7
      - name: Retain compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configuration-log-${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ matrix.toolchain }}
          path: build/configuration.log
          retention-days: 7
