name: ps2build-configurations

on:
  push:
    branches: [rebuild/main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configurations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target.edition }} / ${{ matrix.target.configuration }} / ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Only the builds no other workflow makes. Every other Korium, RA and IncebtIon configuration, with GCC in
        # Rolling Release and with LLVM in RiptOPLLVM, is built there on every pull request and push (rolling-release.yml
        # and rolling-llvm.yml list the same editions and configurations), so building it here too only spent runner time.
        include:
          - {toolchain: gcc, target: {edition: ra, configuration: ingame_debug}}
          - {toolchain: llvm, target: {edition: ra, configuration: ingame_debug}}
          - {toolchain: llvm, target: {edition: incebtion, configuration: extras_ds5}}
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # The ps2build SDK pinned in .github/ps2build-sdk.env (bumped by ps2build-sdk-watch.yml once a week):
      # resolving it makes no network call. The SDK cached under those versions is restored, else an older
      # cached SDK is updated in place, else it is installed: from the official GitHub releases, or when they fail
      # from the pinned NathanNeurotic/old-ps2build-mirror release. Then it is cached. A mirror fallback that does
      # not hold the pinned versions is never cached under them.
      - name: Resolve the pinned ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        id: sdk
        run: sh tools/ps2build_sdk.sh --resolve ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-
      - name: Install the ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: sh tools/ps2build_sdk.sh ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$PS2BUILD_HOME"
      - name: Install matching ports and prepare assets
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: |
          sh tools/install_ps2build.sh
          python tools/assets.py fetch
          python tools/assets.py lang
      - name: Cache the ps2build SDK
        # Saved only from rebuild/main: a pull request that misses the cache must not add a second, different
        # SDK under the same key, which later jobs of that pull request would restore instead.
        if: ${{ github.ref == 'refs/heads/rebuild/main' && steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
      - name: Build configuration candidate
        shell: bash
        run: |
          mkdir -p build
          python tools/build_edition.py '${{ matrix.target.edition }}' --configuration '${{ matrix.target.configuration }}' --toolchain '${{ matrix.toolchain }}' 2>&1 | tee build/configuration.log
      - name: Retain configuration candidate and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configuration-${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ matrix.toolchain }}
          path: dist/configurations/${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ matrix.toolchain }}/
          if-no-files-found: error
      - name: Retain compiler log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configuration-log-${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ matrix.toolchain }}
          path: build/configuration.log
