name: build-flavours


# Migration host checks and a ps2build smoke build. Release editions live in
# rolling-release.yml; compiler validation lives in ps2build.yml.

on:
  push:
    branches:
      - rebuild/main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-parity-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install release-definition dependency
        run: python3 -m pip install -r requirements.txt
      - name: Check reset argument bounds and failure lifecycle
        run: |
          python3 .github/scripts/test_reset_arg_bounds.py
          python3 .github/scripts/test_release_editions.py
          python3 .github/scripts/test_ps2build_configurations.py
          python3 .github/scripts/test_install_ports.py
          python3 .github/scripts/test_reset_failure_lifecycle.py
          python3 .github/scripts/test_iop_pad.py
          python3 .github/scripts/test_igr_pad_lifetime.py
          python3 .github/scripts/test_ee_hook_context.py
          python3 .github/scripts/test_pad_hook_cache.py
          python3 .github/scripts/test_pad_pattern_bounds.py
          python3 .github/scripts/test_foreground_settings_config.py
          python3 .github/scripts/test_config_prefetch_generation.py
          python3 .github/scripts/test_release_publication.py
          python3 .github/scripts/test_config_save_integrity.py
          python3 .github/scripts/test_bdm_empty_literal_slot.py
          python3 .github/scripts/test_mx4sio_host_boot.py
          python3 .github/scripts/test_mx4sio_retry.py
          python3 .github/scripts/test_vmc_write_result.py
          python3 .github/scripts/test_neutrino_dvr_contract.py
          python3 .github/scripts/test_package_orbit_neutrino.py
          python3 .github/scripts/test_orbit_neutrino_watch.py
          python3 .github/scripts/test_bdma_shipped_pairs.py
      - name: Check the RIPPS2 port (backend, art, lists, game management, text, Drive Status, GUI)
        run: |
          for t in .github/scripts/test_ripps2_*.py; do
            echo "== $t"
            python3 "$t"
          done
      - name: Check C++ Coverflow page navigation
        run: python3 .github/scripts/test_page_animation.py
      - name: Check RA-only Mode 6 snapshot handler and registration retries
        run: python3 .github/scripts/test_ra_mode6.py
      - name: Check UDP NIC reservation, DEV9 failure/retry and queued IP conflict notice
        run: python3 .github/scripts/test_network_parity_922.py
      - name: Check real C++ configuration round trips and host modules under ASan/UBSan
        run: sh tests/host/run.sh
      - name: Check Ember image filtering, VMC recovery and checked SMB Refresh
        run: |
          python3 .github/scripts/test_legacy_parity_885_898.py
          python3 .github/scripts/test_genvmc_recovery.py
          python3 .github/scripts/test_genvmc_lifecycle.py
          python3 .github/scripts/test_auto_vmc.py
      - name: Check POPS UDPFS configuration and multi-volume rollback failures
        run: |
          python3 .github/scripts/test_pops_udpfs.py
          python3 .github/scripts/test_udpfs_library_launch.py
          python3 .github/scripts/test_ul_scan_integrity.py
      - name: Check VMC preservation and BDM allocation recovery
        run: |
          python3 .github/scripts/test_vmc_preserve_existing.py
          python3 .github/scripts/test_native_vmc_layout.py
          python3 .github/scripts/test_mmce_sio2man_pack.py
          python3 .github/scripts/test_bdm_private_allocation.py
          python3 .github/scripts/test_ilink_readiness.py
          python3 .github/scripts/test_ps2_logo_validation.py
          python3 .github/scripts/test_bdm_read_alignment.py
      - name: Check image cache, menu allocation and queue lifetime failures
        run: |
          python3 .github/scripts/test_cache_allocation.py
          python3 .github/scripts/test_menu_allocation.py
          python3 .github/scripts/test_io_menu_lifetime.py

  apa-safety-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the APA table write fence, driver write policy and raw hdd0 paths
        run: python3 .github/scripts/test_apa_table_safety.py
      - name: Check the APA recovery tool against synthetic damaged disks
        run: python3 .github/scripts/test_apa_recover.py
      - name: Check Apps launch paths and argument limits before teardown
        run: python3 .github/scripts/test_app_launch_args.py
      - name: Check Auto Loading settings discovery and APA+exFAT hybrid detection
        run: python3 .github/scripts/test_autolaunch_settings.py
      - name: Check HDD mini autolaunch resolves a proven HDL row before handoff
        run: python3 .github/scripts/test_hdd_mini_autolaunch.py
      - name: Check Automatic Refresh never suppresses a source's first list population
        run: python3 .github/scripts/test_autorefresh_initial_population.py
      - name: Check that background music never holds audsrv across an open-ended wait
        run: python3 .github/scripts/test_audio_threads.py
      - name: Check that background music survives a card that loses the file's descriptor
        run: python3 .github/scripts/test_bgm_source.py
      - name: Check that a held button keeps repeating across the tick-counter wrap
        run: python3 .github/scripts/test_pad_repeat_clock.py
      - name: Check that a missed pad read is not a release, and rumble alignment waits for a quiet pad
        run: python3 .github/scripts/test_pad_missed_read.py
      - name: Check that the handoff probe only refuses a target the child cannot load
        run: python3 .github/scripts/test_handoff_probe.py
      - name: Check that a blind button press cannot keep a video mode the TV cannot show
        run: python3 .github/scripts/test_vmode_confirm.py
      - name: Check that leaving a 704-wide, 720p or 1080i mode gives the GUI thread its priority back
        run: python3 .github/scripts/test_hires_thread_priority.py
      - name: Check that the 480i/576i HIRES modes draw inside a 4:3 safe area
        run: python3 .github/scripts/test_vmode_safe_area.py
      - name: Check Back on a Settings page keeps its edits and only a real change reconnects SMB
        run: python3 .github/scripts/test_settings_back_keeps_edits.py
      - name: Check Settings pages fit before they scroll, BDM rows indent, and RiptOPL's plasma
        run: python3 .github/scripts/test_settings_fit.py
      - name: Check settings text stays on screen (long notes wrap, labels leave room, values fit)
        run: python3 .github/scripts/test_dia_text_room.py
      - name: Check Settings and its prompts follow the user's confirm button
        run: python3 .github/scripts/test_confirm_button.py
      - name: Check that a broken cheat file is never reported as a missing one
        run: python3 .github/scripts/test_cheat_load.py
      - name: Check full cheat tables preserve accepted entries
        run: python3 .github/scripts/test_cheat_capacity.py
      - name: Check that a -bsdfs=bd launch without a device number is refused before teardown
        run: python3 .github/scripts/test_neutrino_bsdfs.py
      - name: Check Neutrino SMB writes bsd-smb.toml safely and falls back to the OPL core
        run: python3 .github/scripts/test_neutrino_smb.py
      - name: Check Neutrino argument editing preserves full values and rejects overlong saves
        run: python3 .github/scripts/test_neutrino_args_editor.py
      - name: Check Neutrino launch arguments fit before teardown without dropping tokens
        run: python3 .github/scripts/test_neutrino_argv_budget.py
      - name: Check Neutrino TOML rewrites and rollback on memory cards and FAT
        run: python3 .github/scripts/test_neutrino_toml_sync.py
      - name: Check that turning Network Connectivity off and on keeps the chosen protocol
        run: python3 .github/scripts/test_net_protocol_pick.py
      - name: Check that long theme text stops at the next element and scrolls instead of overlapping
        run: python3 .github/scripts/test_theme_text_room.py
      - name: Check Favorites failure feedback, persistence ordering, first-run view and title layout
        run: python3 .github/scripts/test_favorites_parity.py
      - name: Refuse Favorites edits after unreadable or incomplete stores and check IO failures
        run: python3 .github/scripts/test_favorites_storage_io.py
      - name: Check opt-in CFG title cache, source identity and refresh ordering
        run: python3 .github/scripts/test_cfg_titles.py
      - name: Check logo artwork toggle and cache isolation
        run: python3 .github/scripts/test_logo_art_toggle.py
      - name: Check VMC and PADEMU SIO2MAN version and alias isolation
        run: python3 .github/scripts/test_sio2man_hooks.py
      - name: Check per-game parental lock and test/autolaunch paths
        run: python3 .github/scripts/test_game_parental_lock.py
      - name: Check Neutrino VMC fragment budget recovery and Beat Down title compat defaults
        run: python3 .github/scripts/test_issues_830_831.py
      - name: Check opt-in CJK glyph fallback and home directory resolution
        run: python3 .github/scripts/test_cjk_font_fallback.py
      - name: Check opt-in [PS1]/[PS2] game-type list labels and app item preservation
        run: python3 .github/scripts/test_game_type_labels.py
      - name: Check About dialog layout and QA tester credits
        run: python3 .github/scripts/test_about_credits_layout.py

  release-notes-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check compact release notes and changelog
        run: python3 .github/scripts/test_release_notes.py

  ra-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check disc hashing, disc key lock, history names, font wrap and SYSTEM.CNF parsing
        run: |
          python3 .github/scripts/test_ra_disc.py
          python3 .github/scripts/test_disc_key_semaphore.py
          python3 .github/scripts/test_history_filename_bounds.py
          python3 .github/scripts/test_font_fit_bounds.py
          python3 .github/scripts/test_cnf_missing_equals.py
      - name: Check RA snapshot scheduling and transmission retries
        run: python3 .github/scripts/test_ra_sender.py

  bdm-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the games.bin cache answers as before without O(n^2) work per scan
        run: python3 .github/scripts/test_iso_cache.py
      - name: Check the BDM block cache never returns stale data on a failed refill
        run: python3 .github/scripts/test_bdm_cache.py
      - name: Check BDM partition I/O bounds and sector-size refusal
        run: python3 .github/scripts/test_bdm_partitions.py
      - name: Check the game-list sort keeps the old order in O(n log n)
        run: python3 .github/scripts/test_menu_sort.py
      - name: Check a failed first PS2 scan runs once and names the folder
        run: python3 .github/scripts/test_bdm_scan_retry.py
      - name: Check a settings re-apply keeps the page of a USB/BDM device that is still there (#806)
        run: python3 .github/scripts/test_bdm_keep_page_on_reapply.py
      - name: Check the IO worker skips duplicate module passes and APPS rebuilds on L3
        run: python3 .github/scripts/test_io_queue_trims.py
      - name: Check the selected cover is read first and an abandoned background is aborted (#772)
        run: python3 .github/scripts/test_art_queue_order.py
      - name: Check Ember settings are only written once changed in RiptOPL
        run: python3 .github/scripts/test_ember_settings.py

  udpfs-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check cumulative ACK order and sequence wrap
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic modules/network/udpfs_ioman/tests/test_ack_sequence.c -o /tmp/test_udpfs_ack
          /tmp/test_udpfs_ack
      - name: Check both SDK driver variants use the canonical UDPFS transport
        run: python3 .github/scripts/test_udpfs_shared_transport.py
      - name: Check reconnects, stale ACKs and discovery ARP packets
        run: python3 .github/scripts/test_udpfs_transport.py
      - name: Check overlapping file callers and watchdog operations are serialized
        run: python3 .github/scripts/test_udpfs_serialization.py
      - name: Check UDPFS themes are registered only after the server answers
        run: python3 .github/scripts/test_udpfs_themes.py
      - name: Check UDPFS ART spelling resolution and complete art index sweeps
        run: python3 .github/scripts/test_udpfs_art.py

  site-sync-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the generator for the site search index and RetroAchievements page
        run: |
          python3 -m venv "$RUNNER_TEMP/site-sync"
          "$RUNNER_TEMP/site-sync/bin/pip" install --quiet beautifulsoup4==4.15.0 markdown-it-py==4.0.0
          "$RUNNER_TEMP/site-sync/bin/python" .github/scripts/test_site_sync.py
      - name: Check the wiki builder keeps tables, code and anchors
        run: |
          python3 -m venv "$RUNNER_TEMP/wiki-sync"
          "$RUNNER_TEMP/wiki-sync/bin/pip" install --quiet -r .github/requirements-docs.txt
          cd .github/scripts && "$RUNNER_TEMP/wiki-sync/bin/python" test_wiki_sync.py

  # ship/POPS/usbhdfsd.irx.ilink is a checked-in binary built from modules/bdmassault/ilink_bd_assault.
  # Rebuild it with that module's own Makefile in the PS2DEVPINNED container (the toolchain it was
  # built with, which reproduces it exactly) and require every checked-in copy to be that output.
  # A source change therefore needs the rebuilt binary in the same PR: take it from this job's
  # artifact, and update the size in src/sources/vcdsupport.cpp and modules/bdmassault/PROVENANCE.md.
  popstarter-ilink-driver:
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
    steps:
      - name: Install make
        run: apk add --no-cache make
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build ilink_bd_assault.irx with its Makefile
        run: |
          make -C modules/bdmassault/ilink_bd_assault clean
          make -C modules/bdmassault/ilink_bd_assault
          mipsel-none-elf-gcc --version | head -1
      - name: Require the checked-in usbhdfsd.irx.ilink copies to be this build
        run: |
          built=modules/bdmassault/ilink_bd_assault/ilink_bd_assault.irx
          echo "built: $(wc -c < "$built") bytes, $(sha256sum "$built" | cut -d' ' -f1)"
          status=0
          for copy in modules/bdmassault/usbhdfsd.irx.ilink ship/POPS/usbhdfsd.irx.ilink \
                      ship/Example/APP_RIPTOPL-OFFICIALROLLING-VERSION.ZIP/usbhdfsd.irx.ilink; do
            if cmp -s "$built" "$copy"; then
              echo "OK   $copy"
            else
              echo "DIFF $copy: $(wc -c < "$copy") bytes, $(sha256sum "$copy" | cut -d' ' -f1)" >&2
              status=1
            fi
          done
          exit $status
      - name: Upload the built driver
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: popstarter-usbhdfsd-irx-ilink
          path: modules/bdmassault/ilink_bd_assault/ilink_bd_assault.irx
          if-no-files-found: ignore

  build-flavour:
    # The Makefile can no longer build src/ (it is C++ now); ps2build is the build. It brings its own
    # toolchain, so the PS2DEV/OFFICIAL x PINNED/ROLLING container matrix is gone: tools/ps2build_sdk.sh
    # installs the newest SDK (.github/ps2build-sdk.env lists the components), and BUILD-MANIFEST.txt records
    # what it installed.
    # The RA and DIAG flavours return when ps2.yaml can express them.
    runs-on: ubuntu-24.04
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      # Experiment: the toolchain download dies with HTTP/2 "stream error ... INTERNAL_ERROR" / HTTP 521 from the
      # Cloudflare-fronted host on GitHub runners only. Force ps2build (Go) onto HTTP/1.1 to see whether it is the
      # h2 stream that gets reset.
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # The newest ps2build SDK: the latest versions come from git.techwritescode.dev's release API (or,
      # when it is down, the newest NathanNeurotic/ps2build-mirror release). The SDK cached under them is
      # restored, else an older cached SDK is updated in place, else it is installed; then it is cached. A
      # mirror fallback older than the latest is never cached under the latest versions.
      - name: Resolve the latest ps2build SDK
        id: sdk
        run: sh tools/ps2build_sdk.sh --resolve "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-gcc-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-gcc-
      - name: Install the ps2build SDK
        run: sh tools/ps2build_sdk.sh "$PS2BUILD_HOME"

      - name: Install the ogg/vorbis packages (not shipped by the SDK)
        run: tools/install_ps2build.sh
      - name: Cache the ps2build SDK
        if: ${{ steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-gcc-${{ steps.sdk.outputs.key }}

      - name: Assets (translations, lwNBD, embedded blobs, version)
        run: tools/assets.py all

      - name: Build (ps2build)
        shell: bash
        run: $PS2BUILD_HOME/ps2build build 2>&1 | tee build.log

      # `|| true`: this file is a diagnostic and must never be the reason a good build fails to ship.
      - name: Record build manifest
        if: ${{ always() }}
        run: |
          {
            echo "flavour:      PS2BUILD (GSM1080P + PADEMU)"
            echo "built (UTC):  $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "run:          ${{ github.run_id }}"
            echo "ref:          ${{ github.ref }}"
            echo "commit:       ${{ github.sha }}"
            echo "---- toolchain ----"
            ("$PS2BUILD_HOME"/toolchain/ee/bin/mips64r5900el-ps2-elf-gcc --version 2>/dev/null || echo "ee compiler: not probed") | head -1
            ("$PS2BUILD_HOME"/ps2build --version 2>/dev/null || echo "ps2build: unknown") | head -1
          } > BUILD-MANIFEST.txt 2>/dev/null || true
          cat BUILD-MANIFEST.txt || true

      - name: Upload ELF
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        # The upload is a debugging convenience, not the gate: a full artifact-storage quota
        # must not turn a green compile red.
        continue-on-error: true
        with:
          name: OPL-PS2BUILD
          path: |
            build/bin/riptopl-packed.elf
            BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
