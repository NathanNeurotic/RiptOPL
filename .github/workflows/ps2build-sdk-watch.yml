name: ps2build SDK Watch

# Every build job installs the ps2build SDK pinned in .github/ps2build-sdk.env, so no build job asks
# git.techwritescode.dev which release is newest. Unpinned, that was 11 release-API requests per matrix job,
# about 70 jobs per push: 20k to 70k requests a day on tech's server. This watch asks instead, once a week.
#
#   check  .github/scripts/ps2build_sdk_watch.py: one request per pinned name (none for PS2BUILD_SDK_HOLD),
#          plus a look through the private NathanNeurotic/ps2build-mirror for the release that holds exactly
#          the newest versions. Nothing newer: the run ends here.
#   warm   installs the new SDK once per toolchain and caches it on rebuild/main (only what changed is
#          downloaded, on top of the cached SDK). Pull requests and later rebuild/main runs then restore it
#          instead of each of ~70 jobs downloading it again.
#   pr     pushes the bumped pin file to the ci/ps2build-sdk-watch branch and opens (or refreshes) a draft
#          pull request. A push made by GitHub Actions starts no workflow, so it starts the four SDK
#          workflows on that branch itself (Rolling Release with publish=false), and a later run starts any
#          of them that has not run on the branch head. It proposes nothing when the pins on rebuild/main
#          changed after check read them, never merges anything, and leaves a branch someone else has
#          committed to, and its pull request, alone.
#
# When "Allow GitHub Actions to create and approve pull requests" is off in the repository settings, it opens
# an issue with a link that creates the pull request instead.

on:
  schedule:
    # Mondays 16:17 UTC (8:17 AM Pacific standard time). Off the hour to dodge the cron backlog.
    - cron: "17 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps2build-sdk-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'NathanNeurotic/RiptOPL'
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.watch.outputs.status }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compare the pinned SDK with the newest official releases
        id: watch
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: |
          set -eu
          python3 .github/scripts/ps2build_sdk_watch.py --out "$RUNNER_TEMP/watch"
          STATUS="$(cat "$RUNNER_TEMP/watch/status")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = changed ]; then
            cat "$RUNNER_TEMP/watch/body.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.watch.outputs.status == 'changed'
        with:
          name: ps2build-sdk-watch
          path: ${{ runner.temp }}/watch/
          retention-days: 7

  warm:
    needs: check
    # The cache is only shared with every branch when it is saved from rebuild/main.
    if: needs.check.outputs.status == 'changed' && github.ref == 'refs/heads/rebuild/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, llvm]
    # The same environment as the build jobs, so the cached SDK is the one they would have installed.
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ps2build-sdk-watch
          path: ${{ runner.temp }}/watch
      - name: Take the new pins
        run: cp "$RUNNER_TEMP/watch/ps2build-sdk.env" .github/ps2build-sdk.env
      - name: Resolve the pinned ps2build SDK
        id: sdk
        run: sh tools/ps2build_sdk.sh --resolve ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-
      - name: Install the ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: sh tools/ps2build_sdk.sh ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$PS2BUILD_HOME"
      - name: Stop unless the new SDK was installed
        # When the official install fails, the installer takes the newest ps2build-mirror release. If that release
        # lacks the new versions, it sets PS2BUILD_SDK_STALE and nothing is cached under the new pins. Failing here
        # keeps pr from opening a pull request whose build jobs would each ask the official server again; the next
        # run tries again.
        if: ${{ env.PS2BUILD_SDK_STALE == 'true' }}
        run: |
          echo "::error::The new ps2build SDK could not be installed (the official install failed, and no ps2build-mirror release holds these versions yet), so it is not cached. The pull request waits for the next run."
          exit 1
      - name: Install matching ogg/vorbis packages (not shipped by the SDK)
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: sh tools/install_ps2build.sh
      - name: Stop unless the pinned ogg/vorbis packages were installed
        # The SDK can come from the cache while ogg/vorbis are new. If the official host fails then and the new pins
        # name no ps2build-mirror release yet, tools/install_ports.py takes the newest mirror release's own package,
        # which can be older. Saved under the new pins, it would send every build job that restores this cache to
        # the official host for the pinned package, and an exact cache entry is never replaced. So nothing is saved,
        # and the pull request waits for the next run, unless the installed packages are the pinned ones.
        run: |
          . .github/ps2build-sdk.env
          case "$PS2BUILD_TOOLCHAIN" in llvm) world=packages-llvm/world ;; *) world=packages/world ;; esac
          for package in ogg vorbis; do
            case "$package" in ogg) pinned=$OGG_VERSION ;; *) pinned=$VORBIS_VERSION ;; esac
            installed=$(cat "$PS2DEV_INSTALL_DIR/$world/$package/.release" 2>/dev/null || true)
            if [ -z "$pinned" ] || [ "$installed" != "$pinned" ]; then
              echo "::error::$package ${installed:-(none)} is installed, not the pinned ${pinned:-(none)} (the official host probably failed, and no ps2build-mirror release holds it yet), so the SDK is not cached. The pull request waits for the next run."
              exit 1
            fi
          done
          echo "ogg $OGG_VERSION and vorbis $VORBIS_VERSION are installed, as pinned."
      - name: Cache the ps2build SDK
        if: ${{ steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
      - name: Look the new SDK up in the cache
        # actions/cache/save only warns when its upload fails, and a cache step only warns while the cache service is
        # unavailable. Without this entry, each build job of the pull request pr opens would ask the official server
        # for the new SDK. So warm looks the exact key up, with the same path (the cache version hashes it), and the
        # next step fails unless the cache holds it; the next run tries again.
        id: sdk-saved
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
          lookup-only: true
      - name: Stop unless the cache holds the new SDK
        if: ${{ steps.sdk-saved.outputs.cache-hit != 'true' }}
        run: |
          echo "::error::The cache does not hold the new ps2build SDK (its upload or the cache service failed), and each build job of the pull request would ask the official server for it. The pull request waits for the next run."
          exit 1

  pr:
    needs: [check, warm]
    # No status function here, so this job runs only when warm succeeded. That is on purpose: a pull request for
    # pins the cache does not hold yet would send each of its build jobs to the official server for the new SDK.
    # A failed warm leaves the update for the next run.
    if: needs.check.outputs.status == 'changed' && github.ref == 'refs/heads/rebuild/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # push the ci/ps2build-sdk-watch branch
      pull-requests: write  # open or refresh the draft pull request
      issues: write         # the fallback when Actions may not open pull requests
      actions: write        # start the SDK workflows on that branch
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ci/ps2build-sdk-watch
      BOT: 41898282+github-actions[bot]@users.noreply.github.com
      ISSUE_TITLE: ps2build SDK update ready
      CHECKED: ${{ github.sha }}  # the commit check read the pins at; github.sha is the same in every job of a run
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rebuild/main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ps2build-sdk-watch
          path: ${{ runner.temp }}/watch
      - name: Push the new pins and open or refresh the draft pull request
        run: |
          set -eu
          W="$RUNNER_TEMP/watch"
          R="$GITHUB_REPOSITORY"
          if ! git diff --quiet "$CHECKED" HEAD -- .github/ps2build-sdk.env; then
            # check read the pins at $CHECKED. Copying its pin file over newer pins would undo that change (a
            # hold, say), so this run proposes nothing, and the next run starts from the new pins.
            echo "::warning::.github/ps2build-sdk.env changed on rebuild/main after this run read it, so it proposes nothing. The next run starts from the new pins."
            exit 0
          fi
          cp "$W/ps2build-sdk.env" .github/ps2build-sdk.env
          OLD=
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            OLD="$(git rev-parse "origin/$BRANCH")"
          fi

          if [ -n "$OLD" ] && git log --format='%ae%n%ce' "origin/rebuild/main..origin/$BRANCH" | grep -qvxF "$BOT"; then
            # Someone added commits (a fix for the new SDK, say), or amended the watch's commit, which keeps the
            # watch as its author but not as its committer. Never overwrite their work, and leave its pull request
            # alone too, even when the branch already holds these pins.
            echo "::warning::$BRANCH has commits that are not the watch's; leaving it alone. Merge or close its pull request, then run the watch again."
            exit 0
          elif [ -n "$OLD" ] && git show "origin/$BRANCH:.github/ps2build-sdk.env" | cmp -s - .github/ps2build-sdk.env; then
            echo "$BRANCH already proposes these pins."
            HEAD_SHA="$OLD"
          else
            git config user.name "github-actions[bot]"
            git config user.email "$BOT"
            git checkout -q -B "$BRANCH" origin/rebuild/main
            git add .github/ps2build-sdk.env
            git commit -q -F "$W/commit.txt"
            # The branch belongs to the watch: each run proposes the newest pins on top of rebuild/main.
            git push --force-with-lease="refs/heads/$BRANCH:$OLD" origin "HEAD:refs/heads/$BRANCH"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          TITLE="$(cat "$W/title")"
          PR="$(gh pr list --repo "$R" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$R" --title "$TITLE" --body-file "$W/body.md"
            echo "Refreshed #$PR."
          elif gh pr create --repo "$R" --draft --base rebuild/main --head "$BRANCH" --title "$TITLE" --body-file "$W/body.md"; then
            :
          else
            # Most likely "Allow GitHub Actions to create and approve pull requests" is off. Ask in an issue.
            {
              echo "The ps2build SDK Watch pushed new pins to \`$BRANCH\` but could not open the pull request."
              echo "Open it here: https://github.com/$R/compare/rebuild/main...$BRANCH?expand=1"
              echo
              cat "$W/body.md"
            } > "$W/issue.md"
            EXISTING="$(gh issue list --repo "$R" --state open --limit 100 --json number,title \
              --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --repo "$R" --body-file "$W/issue.md"
            else
              gh issue create --repo "$R" --title "$ISSUE_TITLE" --body-file "$W/issue.md"
            fi
          fi

          # A push made with GITHUB_TOKEN starts no workflow, so the watch starts the builds on its branch itself. A
          # later run starts each one that has no run on the branch head yet (its dispatch failed, say); every one
          # is tried before the step fails.
          FAILED=
          dispatch() {
            RUNS="$(gh run list --repo "$R" --workflow "$1" --commit "$HEAD_SHA" --limit 1 \
              --json databaseId --jq length)" || RUNS=
            if [ "$RUNS" = 1 ]; then
              echo "$1 already ran on $BRANCH."
            elif ! gh workflow run "$@" --repo "$R" --ref "$BRANCH"; then
              FAILED="$FAILED $1"
            fi
          }
          dispatch ps2build.yml
          dispatch configurations.yml
          dispatch flavours.yml
          dispatch rolling-release.yml -f publish=false
          if [ -n "$FAILED" ]; then
            echo "::error::Could not start$FAILED on $BRANCH. The next run starts whatever has not run there."
            exit 1
          fi
