name: NULD Neutrino RA Watch

# Keeps the RetroAchievements kits' Neutrino (NULD's fork, danielnuld/nuld; ORBIT was renamed NULD at v1.2)
# level with NULD's newest stable release. The runtime is pinned by tag and archive SHA-256 in
# third_party/orbit-neutrino/release.json, and tools/package_edition.py refuses any other archive, so a new
# runtime needs a commit -- like Ember Watch, and unlike Neutrino Watch (standard kits download the latest
# official Neutrino at build time).
#
# NULD often releases launcher-only changes (v1.3): the neutrino/ folder the RA kits ship is unchanged. So
# on a new release this downloads the pinned and the new archive and compares that folder file by file
# (.github/scripts/orbit_neutrino_watch.py). Launcher-only: nothing happens. Changed: the new archive must
# match GitHub's digest, pass the packer's own checks and keep the snapshot limit RiptOPL hard-codes; then
# the pin and the docs that link the release are updated, the RA tests run, the change is committed to
# rebuild/main and the three-edition Rolling Release is started (a GITHUB_TOKEN push starts no workflow on
# its own). Anything unexpected fails the run without touching the repository. It never opens issues.
# Pre-releases are ignored: only stable NULD releases reach the kits.

on:
  schedule:
    # Same ticks as neutrino-watch.yml (1st, 11th and 21st, 05:41 UTC) plus the days between: daily, off-hour.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch the three-edition rolling release after the commit

concurrency:
  group: orbit-neutrino-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'NathanNeurotic/RiptOPL'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORBIT_REPO: danielnuld/nuld
    steps:
      - name: Checkout rebuild/main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: rebuild/main
          fetch-depth: 0

      - name: Compare NULD's newest release with the RA runtime pin
        id: cmp
        run: |
          set -eu
          T="$RUNNER_TEMP/orbit"
          mkdir -p "$T"
          # The newest published, non-pre-release release that carries a runtime archive.
          if ! gh api --paginate --slurp "repos/$ORBIT_REPO/releases?per_page=100" | jq \
            '[.[][] | select(.draft | not) | select(.prerelease | not) | select(any(.assets[]; .name | test("^(ORBIT|NULD)-.*[.]zip$")))] | sort_by(.published_at) | last // empty' \
            > "$T/release.json" || [ ! -s "$T/release.json" ]; then
            echo "::warning::Could not read NULD's releases (transient?); nothing to do."
            exit 0
          fi
          TAG="$(jq -r '.tag_name // empty' "$T/release.json")"
          python3 .github/scripts/orbit_neutrino_watch.py check --release "$T/release.json" --out "$T"
          if [ "$(cat "$T/status")" = unverified ]; then
            gh release download "$TAG" --repo "$ORBIT_REPO" --pattern "$(cat "$T/asset")" --dir "$T/new" --clobber
            SUM="$(sha256sum "$T/new/$(cat "$T/asset")" | cut -d' ' -f1)"
            python3 .github/scripts/orbit_neutrino_watch.py check --release "$T/release.json" --asset-sha256 "$SUM" --out "$T"
          fi
          if [ "$(cat "$T/status")" = new ]; then
            { echo "new=yes"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Compare the shipped neutrino/ folders and update the pin
        id: update
        if: steps.cmp.outputs.new == 'yes'
        env:
          TAG: ${{ steps.cmp.outputs.tag }}
        run: |
          set -eu
          T="$RUNNER_TEMP/orbit"
          PIN_REPO="$(jq -r .repository third_party/orbit-neutrino/release.json)"
          PIN_TAG="$(jq -r .tag third_party/orbit-neutrino/release.json)"
          PIN_ASSET="$(jq -r .asset third_party/orbit-neutrino/release.json)"
          gh release download "$PIN_TAG" --repo "$PIN_REPO" --pattern "$PIN_ASSET" --dir "$T/old" --clobber
          gh release download "$TAG" --repo "$ORBIT_REPO" --pattern "$(cat "$T/asset")" --dir "$T/new" --clobber
          COMMIT="$(gh api "repos/$ORBIT_REPO/commits/$TAG" --jq .sha)"
          gh api "repos/$ORBIT_REPO/contents/third_party/neutrino-igr/raagent/src/main.c?ref=$COMMIT" \
            -H "Accept: application/vnd.github.raw" > "$T/agent.c"
          python3 .github/scripts/orbit_neutrino_watch.py update --release "$T/release.json" --out "$T" \
            --old "$T/old/$PIN_ASSET" --new "$T/new/$(cat "$T/asset")" --agent-source "$T/agent.c" --tag-commit "$COMMIT"
          if [ "$(cat "$T/status")" = updated ]; then
            echo "updated=yes" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Re-run the RA runtime tests against the new pin
        if: steps.update.outputs.updated == 'yes'
        run: |
          set -eu
          python3 .github/scripts/test_package_orbit_neutrino.py
          python3 .github/scripts/test_orbit_neutrino_watch.py
          python3 .github/scripts/test_release_publication.py
          python3 .github/scripts/test_neutrino_ra.py

      - name: Commit to rebuild/main
        if: steps.update.outputs.updated == 'yes'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A third_party/orbit-neutrino README.md docs/RETROACHIEVEMENTS.md
          git commit -q -F "$RUNNER_TEMP/orbit/commit.txt"
          for attempt in 1 2 3; do
            if git push origin HEAD:rebuild/main; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "Could not push after 3 attempts." >&2; exit 1; }
            git pull --rebase -q origin rebuild/main
          done
          echo "Pinned NULD $(jq -r .tag third_party/orbit-neutrino/release.json) on rebuild/main."
          gh workflow run rolling-release.yml --repo "$GITHUB_REPOSITORY" --ref rebuild/main -f publish=true
