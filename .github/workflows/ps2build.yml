name: ps2build

# Compiler validation with the single ps2build SDK. Releases are Korium, RA and IncebtIon.
on:
  push:
    branches: [ps2build, rebuild/main, "claude/**"]
  pull_request:
  workflow_dispatch: # ps2build-sdk-watch.yml starts it on its pull request's branch
    inputs:
      mirror-drill:
        description: Install without the SDK cache and with the official host unreachable, to prove the mirror fallback
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, llvm]
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
      # Experiment: the toolchain download dies with HTTP/2 "stream error ... INTERNAL_ERROR" / HTTP 521 from the
      # Cloudflare-fronted host on GitHub runners only. Force ps2build (Go) onto HTTP/1.1 to see whether it is the
      # h2 stream that gets reset.
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # The ps2build SDK pinned in .github/ps2build-sdk.env (bumped by ps2build-sdk-watch.yml once a week):
      # resolving it makes no network call. The SDK cached under those versions is restored, else an older
      # cached SDK is updated in place, else it is installed: from the official GitHub releases, or when they fail
      # from the pinned NathanNeurotic/old-ps2build-mirror release. Then it is cached. A mirror fallback that does
      # not hold the pinned versions is never cached under them.
      - name: Resolve the pinned ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        id: sdk
        run: sh tools/ps2build_sdk.sh --resolve ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        if: ${{ !inputs.mirror-drill }}
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-
      - name: Install the ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
          # The drill sends the CLI download to a closed port, so the official attempt fails and the mirror installs.
          PS2BUILD_SDK_OFFICIAL_URL: ${{ inputs.mirror-drill && 'https://127.0.0.1:9' || '' }}
        run: sh tools/ps2build_sdk.sh ${{ matrix.toolchain == 'llvm' && '--llvm' || '' }} "$PS2BUILD_HOME"
      - name: Install matching ogg/vorbis packages (not shipped by the SDK)
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: tools/install_ps2build.sh
      - name: Cache the ps2build SDK
        if: ${{ !inputs.mirror-drill && steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.toolchain }}-${{ steps.sdk.outputs.key }}
      - name: Assets (translations, lwNBD, embedded blobs, version)
        run: tools/assets.py all
      - name: Host tests (source checks, HTTP parsers, ASan/UBSan unit tests)
        run: tools/run_tests.sh -k
      - name: Build
        shell: bash   # -o pipefail, so a failed build is not masked by tee
        run: python3 tools/build.py 2>&1 | tee build.log
      - name: Warning baseline (no new warnings)
        # The existing baseline was measured with GCC. LLVM has distinct
        # diagnostics; keep its build mandatory without inventing a baseline.
        if: matrix.toolchain == 'gcc'
        run: tools/warning_gate.py build.log --check
      - name: Coupling gate (no new upward dependencies between layers)
        run: tools/analyze_coupling.py --check
      - name: Put the libsmb2 licence and the credits beside the loader
        # The loader embeds smb2man over libsmb2 (LGPL-2.1), so its licence travels with the artifact, with
        # CREDITS, which says the loader uses libsmb2 under that licence (LGPL-2.1 section 6).
        run: |
          cp -f modules/network/smb2man/libsmb2/LICENCE-LGPL-2.1.txt build/bin/LICENSE-LIBSMB2.txt
          cp -f CREDITS build/bin/CREDITS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riptopl-ps2build-${{ matrix.toolchain }}
          path: |
            build/bin/riptopl-packed.elf
            build/bin/LICENSE-LIBSMB2.txt
            build/bin/CREDITS
