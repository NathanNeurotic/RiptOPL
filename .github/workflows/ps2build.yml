name: ps2build

# Main flavour only (GSM1080P + PADEMU). Other flavours still build through the Makefile.
on:
  push:
    branches: [ps2build, rebuild/main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ps2build
        run: tools/install_ps2build.sh
      - name: Assets (translations, lwNBD, embedded blobs, version)
        run: tools/assets.py all
      - name: Host tests (source checks, HTTP parsers, ASan/UBSan unit tests)
        run: tools/run_tests.sh -k
      - name: Build
        shell: bash   # -o pipefail, so a failed build is not masked by tee
        run: ~/.local/share/ps2build/ps2build build 2>&1 | tee build.log
      - name: Warning baseline (no new warnings)
        run: tools/warnings.py build.log --check
      - name: Coupling report (informational until phase 8)
        run: tools/analyze_coupling.py | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: riptopl-ps2build
          path: build/bin/riptopl-packed.elf
