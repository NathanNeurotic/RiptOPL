name: ps2build

# Main flavour only (GSM1080P + PADEMU). Other flavours still build through the Makefile.
on:
  push:
    branches: [ps2build, rebuild/main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The toolchain download (~167 MB from git.techwritescode.dev) is occasionally cut off mid-stream
      # ("stream error ... INTERNAL_ERROR; received from peer"). One retry; the second attempt resumes with
      # whatever the first installed.
      - name: Install ps2build + SDK
        id: sdk1
        continue-on-error: true
        uses: techwritescode/setup-sdk@master
        with:
          ps2dev: ${{ github.workspace }}/.ps2dev
      - name: Install ps2build + SDK (retry)
        if: steps.sdk1.outcome == 'failure'
        uses: techwritescode/setup-sdk@master
        with:
          ps2dev: ${{ github.workspace }}/.ps2dev
      - name: Install the ogg/vorbis packages (not shipped by the SDK)
        run: tools/install_ps2build.sh
      - name: Assets (translations, lwNBD, embedded blobs, version)
        run: tools/assets.py all
      - name: Host tests (source checks, HTTP parsers, ASan/UBSan unit tests)
        run: tools/run_tests.sh -k
      - name: Build
        shell: bash   # -o pipefail, so a failed build is not masked by tee
        run: $PS2BUILD_HOME/ps2build build 2>&1 | tee build.log
      - name: Warning baseline (no new warnings)
        run: tools/warning_gate.py build.log --check
      - name: Coupling report (informational until phase 8)
        run: tools/analyze_coupling.py | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: riptopl-ps2build
          path: build/bin/riptopl-packed.elf
