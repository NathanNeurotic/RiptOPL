name: Rolling Release

# PRs are previews. Integration pushes publish all four verified channels (rolling-lite: RiptOPLite).
on:
  push:
    branches: [rebuild/main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the four verified release channels
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event_name == 'workflow_dispatch' && !inputs.publish && 'verification' || 'releases' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each channel's kit, plus the configurations for every theme's VARIANTS, DEBUG, BUGREPORT (diag, unpacked) and RA-VARIANTS bundles.
        target:
          - {edition: korium, configuration: standard}
          - {edition: ra, configuration: standard}
          - {edition: incebtion, configuration: standard}
          - {edition: ra_incebtion, configuration: standard}
          - {edition: korium, configuration: pademu0}
          - {edition: korium, configuration: ds5}
          - {edition: korium, configuration: extras}
          - {edition: korium, configuration: extras_ds5}
          - {edition: korium, configuration: dtl}
          - {edition: korium, configuration: diag}
          - {edition: korium, configuration: debug}
          - {edition: korium, configuration: debug_uart}
          - {edition: korium, configuration: ingame_debug}
          - {edition: korium, configuration: iopcore_debug}
          - {edition: korium, configuration: eesio_debug}
          - {edition: korium, configuration: ingame_debug_uart}
          - {edition: korium, configuration: iopcore_debug_uart}
          - {edition: korium, configuration: ingamediag}
          - {edition: ra, configuration: pademu0}
          - {edition: incebtion, configuration: pademu0}
          - {edition: incebtion, configuration: ds5}
          - {edition: incebtion, configuration: extras}
          - {edition: incebtion, configuration: extras_ds5}
          - {edition: incebtion, configuration: dtl}
          - {edition: incebtion, configuration: diag}
          - {edition: incebtion, configuration: debug}
          - {edition: incebtion, configuration: debug_uart}
          - {edition: incebtion, configuration: ingame_debug}
          - {edition: incebtion, configuration: iopcore_debug}
          - {edition: incebtion, configuration: eesio_debug}
          - {edition: incebtion, configuration: ingame_debug_uart}
          - {edition: incebtion, configuration: iopcore_debug_uart}
          - {edition: incebtion, configuration: ingamediag}
          - {edition: ra_incebtion, configuration: pademu0}
          # rolling-lite: one RiptOPLite build per game device, Korium and RetroAchievements (tools/lite_devices.py).
          - {edition: lite, configuration: standard, device: usb}
          - {edition: lite, configuration: standard, device: mx4sio}
          - {edition: lite, configuration: standard, device: ilink}
          - {edition: lite, configuration: standard, device: hdd}
          - {edition: lite, configuration: standard, device: smb}
          - {edition: lite, configuration: standard, device: udpbd}
          - {edition: lite, configuration: standard, device: udpfs}
          - {edition: lite, configuration: standard, device: mmce}
          - {edition: lite_ra, configuration: standard, device: usb}
          - {edition: lite_ra, configuration: standard, device: mx4sio}
          - {edition: lite_ra, configuration: standard, device: ilink}
          - {edition: lite_ra, configuration: standard, device: hdd}
          - {edition: lite_ra, configuration: standard, device: smb}
          - {edition: lite_ra, configuration: standard, device: udpbd}
          - {edition: lite_ra, configuration: standard, device: udpfs}
          - {edition: lite_ra, configuration: standard, device: mmce}
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: gcc
      GODEBUG: http2client=0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # The ps2build SDK pinned in .github/ps2build-sdk.env (bumped by ps2build-sdk-watch.yml once a week):
      # resolving it makes no network call. The SDK cached under those versions is restored, else an older
      # cached SDK is updated in place, else it is installed: from git.techwritescode.dev, or when that fails
      # from the pinned NathanNeurotic/ps2build-mirror release. Then it is cached. A mirror fallback that does
      # not hold the pinned versions is never cached under them.
      - name: Resolve the pinned ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        id: sdk
        run: sh tools/ps2build_sdk.sh --resolve "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-gcc-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-gcc-
      - name: Install the ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: sh tools/ps2build_sdk.sh "$PS2BUILD_HOME"
      - name: Install matching audio packages and fetch assets
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: |
          sh tools/install_ps2build.sh
          python tools/assets.py fetch
          python tools/assets.py lang
      - name: Cache the ps2build SDK
        if: ${{ steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-gcc-${{ steps.sdk.outputs.key }}
      - name: Build the edition (GCC)
        shell: bash
        run: |
          mkdir -p build
          device=()
          if [ -n '${{ matrix.target.device }}' ]; then device=(--device '${{ matrix.target.device }}'); fi
          python tools/build_edition.py '${{ matrix.target.edition }}' --configuration '${{ matrix.target.configuration }}' "${device[@]}" 2>&1 | tee build/edition.log
      - name: Retain the configuration build
        if: matrix.target.configuration != 'standard'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variant-${{ matrix.target.edition }}-${{ matrix.target.configuration }}
          path: dist/configurations/${{ matrix.target.edition }}-${{ matrix.target.configuration }}-gcc/
          if-no-files-found: error
      - name: Retain the RiptOPLite build
        if: matrix.target.device
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target.edition }}-${{ matrix.target.device }}
          path: dist/lite/${{ matrix.target.edition == 'lite_ra' && 'ra-' || '' }}${{ matrix.target.device }}-gcc/
          if-no-files-found: error
      - name: Download the official companion core
        if: matrix.target.configuration == 'standard' && !matrix.target.device
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p build/companion
          gh release download latest --repo ps2max32/neutrino --dir build/companion --pattern '*.7z'
      - name: Package and verify the full install kit
        if: matrix.target.configuration == 'standard' && !matrix.target.device
        shell: bash
        run: |
          mapfile -t cores < <(find build/companion -maxdepth 1 -name 'neutrino_*.7z' -type f)
          test "${#cores[@]}" -eq 1
          python tools/package_edition.py '${{ matrix.target.edition }}' --neutrino-archive "${cores[0]}"
      - name: Retain verified release candidate
        if: matrix.target.configuration == 'standard' && !matrix.target.device
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target.edition }}
          path: dist/releases/${{ matrix.target.edition }}/
          if-no-files-found: error
      - name: Retain compiler log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-log-${{ matrix.target.edition }}-${{ matrix.target.configuration }}${{ matrix.target.device && format('-{0}', matrix.target.device) || '' }}
          path: build/edition.log

  publish:
    needs: build
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == 'refs/heads/rebuild/main' && github.repository == 'NathanNeurotic/RiptOPL'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read # an overtaken run looks up the newer head's run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/downloaded
      - uses: actions/download-artifact@v4
        with:
          pattern: variant-*
          path: dist/downloaded
      - uses: actions/download-artifact@v4
        with:
          pattern: lite*-*
          path: dist/downloaded
      - name: Verify and publish the four channels
        run: python tools/publish_editions.py dist/downloaded
