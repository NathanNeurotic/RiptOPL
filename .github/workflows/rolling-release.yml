name: Rolling Release

# PRs are previews. Integration pushes publish all three verified channels:
#   rolling      (RiptOPL, LLVM, Latest)
#   rolling-ra   (RetroAchievements, GCC)
#   rolling-lite (RiptOPLite, GCC)
on:
  push:
    branches: [rebuild/main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the three verified release channels
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event_name == 'workflow_dispatch' && !inputs.publish && 'verification' || 'releases' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target.edition }} / ${{ matrix.target.configuration }}${{ matrix.target.device && format(' / {0}', matrix.target.device) || '' }} (${{ matrix.target.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each channel's kit, plus the configurations for RiptOPL's VARIANTS, DEBUG, BUGREPORT (diag, unpacked)
        # and RetroAchievements' RA-VARIANTS bundles.
        target:
          # rolling: RiptOPL (LLVM)
          - {edition: riptopl, configuration: standard, toolchain: llvm}
          - {edition: riptopl, configuration: pademu0, toolchain: llvm}
          - {edition: riptopl, configuration: ds5, toolchain: llvm}
          - {edition: riptopl, configuration: extras, toolchain: llvm}
          - {edition: riptopl, configuration: extras_ds5, toolchain: llvm}
          - {edition: riptopl, configuration: dtl, toolchain: llvm}
          - {edition: riptopl, configuration: diag, toolchain: llvm}
          - {edition: riptopl, configuration: debug, toolchain: llvm}
          - {edition: riptopl, configuration: debug_uart, toolchain: llvm}
          - {edition: riptopl, configuration: ingame_debug, toolchain: llvm}
          - {edition: riptopl, configuration: iopcore_debug, toolchain: llvm}
          - {edition: riptopl, configuration: eesio_debug, toolchain: llvm}
          - {edition: riptopl, configuration: ingame_debug_uart, toolchain: llvm}
          - {edition: riptopl, configuration: iopcore_debug_uart, toolchain: llvm}
          - {edition: riptopl, configuration: ingamediag, toolchain: llvm}
          # rolling-ra: RetroAchievements (GCC)
          - {edition: ra, configuration: standard, toolchain: gcc}
          - {edition: ra, configuration: pademu0, toolchain: gcc}
          # rolling-lite: one RiptOPLite build per game device, standard and RetroAchievements (GCC, tools/lite_devices.py).
          - {edition: lite, configuration: standard, device: usb, toolchain: gcc}
          - {edition: lite, configuration: standard, device: mx4sio, toolchain: gcc}
          - {edition: lite, configuration: standard, device: ilink, toolchain: gcc}
          - {edition: lite, configuration: standard, device: hdd, toolchain: gcc}
          - {edition: lite, configuration: standard, device: smb, toolchain: gcc}
          - {edition: lite, configuration: standard, device: udpbd, toolchain: gcc}
          - {edition: lite, configuration: standard, device: udpfs, toolchain: gcc}
          - {edition: lite, configuration: standard, device: mmce, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: usb, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: mx4sio, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: ilink, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: hdd, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: smb, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: udpbd, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: udpfs, toolchain: gcc}
          - {edition: lite_ra, configuration: standard, device: mmce, toolchain: gcc}
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: ${{ matrix.target.toolchain }}
      GODEBUG: http2client=0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # The ps2build SDK pinned in .github/ps2build-sdk.env (bumped by ps2build-sdk-watch.yml once a week):
      # resolving it makes no network call. The SDK cached under those versions is restored, else an older
      # cached SDK is updated in place, else it is installed: from the official GitHub releases, or when they fail
      # from the pinned NathanNeurotic/old-ps2build-mirror release. Then it is cached. A mirror fallback that does
      # not hold the pinned versions is never cached under them.
      - name: Resolve the pinned ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        id: sdk
        run: sh tools/ps2build_sdk.sh --resolve ${{ matrix.target.toolchain == 'llvm' && '--llvm' || '' }} "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.target.toolchain }}-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-${{ matrix.target.toolchain }}-
      - name: Install the ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: sh tools/ps2build_sdk.sh ${{ matrix.target.toolchain == 'llvm' && '--llvm' || '' }} "$PS2BUILD_HOME"
      - name: Install matching audio packages and fetch assets
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        run: |
          sh tools/install_ps2build.sh
          python tools/assets.py fetch
          python tools/assets.py lang
      - name: Cache the ps2build SDK
        # Saved only from rebuild/main: a pull request that misses the cache must not add a second, different
        # SDK under the same key, which later jobs of that pull request would restore instead.
        if: ${{ github.ref == 'refs/heads/rebuild/main' && steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: ps2build-sdk-${{ runner.os }}-${{ matrix.target.toolchain }}-${{ steps.sdk.outputs.key }}
      - name: Build the edition
        shell: bash
        run: |
          mkdir -p build
          device=()
          if [ -n '${{ matrix.target.device }}' ]; then device=(--device '${{ matrix.target.device }}'); fi
          python tools/build_edition.py '${{ matrix.target.edition }}' --configuration '${{ matrix.target.configuration }}' --toolchain '${{ matrix.target.toolchain }}' "${device[@]}" 2>&1 | tee build/edition.log
      - name: Reject mixed GCC and LLVM objects in the linked loader
        if: matrix.target.toolchain == 'llvm'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t linked < <(find build -type f -path '*/obj/riptopl/riptopl.unstripped.elf')
          test "${#linked[@]}" -eq 1
          python tools/check_llvm_purity.py "$PS2BUILD_HOME/llvm-toolchain/llvm/bin/llvm-readobj" "${linked[0]}"
      - name: Retain the configuration build
        if: matrix.target.configuration != 'standard'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variant-${{ matrix.target.edition }}-${{ matrix.target.configuration }}-attempt${{ github.run_attempt }}
          path: dist/configurations/${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ matrix.target.toolchain }}/
          if-no-files-found: error
      - name: Retain the RA build for its unpacked loader
        # RIPTOPL-RA-VARIANTS carries the standard RA loader unpacked beside pademu0 (publish_editions.py).
        if: matrix.target.configuration == 'standard' && !matrix.target.device && startsWith(matrix.target.edition, 'ra')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variant-${{ matrix.target.edition }}-standard
          path: dist/editions/${{ matrix.target.edition }}/
          if-no-files-found: error
      - name: Retain the RiptOPLite build
        if: matrix.target.device
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target.edition }}-${{ matrix.target.device }}-attempt${{ github.run_attempt }}
          path: dist/lite/${{ matrix.target.edition == 'lite_ra' && 'ra-' || '' }}${{ matrix.target.device }}-${{ matrix.target.toolchain }}/
          if-no-files-found: error
      - name: Download the official companion core
        # RA packaging uses its pinned ORBIT ZIP; the upstream .7z is not read.
        if: matrix.target.configuration == 'standard' && !matrix.target.device && !startsWith(matrix.target.edition, 'ra')
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1 && ! command -v 7za >/dev/null 2>&1; then
            echo "Installing 7-Zip (missing from runner)"
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq p7zip-full
          fi
          mkdir -p build/companion
          echo "Downloading upstream Neutrino core"
          timeout 120s gh release download latest --repo ps2max32/neutrino --dir build/companion --pattern '*.7z'
      - name: Package and verify the full install kit
        if: matrix.target.configuration == 'standard' && !matrix.target.device
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.target.edition }}' == ra* ]]; then
            # The RA kit independently downloads and verifies the pinned ORBIT runtime.
            python tools/package_edition.py '${{ matrix.target.edition }}' --compiler '${{ matrix.target.toolchain }}'
          else
            mapfile -t cores < <(find build/companion -maxdepth 1 -name 'neutrino_*.7z' -type f)
            test "${#cores[@]}" -eq 1
            python tools/package_edition.py '${{ matrix.target.edition }}' --neutrino-archive "${cores[0]}" --compiler '${{ matrix.target.toolchain }}'
          fi
      - name: Retain verified release candidate
        if: matrix.target.configuration == 'standard' && !matrix.target.device
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target.edition }}-attempt${{ github.run_attempt }}
          path: dist/releases/${{ matrix.target.edition }}/
          if-no-files-found: error
      - name: Retain compiler log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-log-${{ matrix.target.edition }}-${{ matrix.target.configuration }}${{ matrix.target.device && format('-{0}', matrix.target.device) || '' }}
          path: build/edition.log

  verify:
    name: Verify all three release channels (never publishes)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/attempts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: variant-*
          path: dist/attempts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lite*-*
          path: dist/attempts
      - name: Keep each build's newest run attempt
        run: python -S tools/newest_attempts.py dist/attempts dist/downloaded
      - name: Verify channel provenance, checksums and archive integrity
        run: python tools/publish_editions.py dist/downloaded --check

  publish:
    needs: [build, verify]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == 'refs/heads/rebuild/main' && github.repository == 'NathanNeurotic/RiptOPL'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read # an overtaken run looks up the newer head's run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/attempts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: variant-*
          path: dist/attempts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lite*-*
          path: dist/attempts
      - name: Keep each build's newest run attempt
        run: python -S tools/newest_attempts.py dist/attempts dist/downloaded
      - name: Verify and publish the three channels
        run: python tools/publish_editions.py dist/downloaded
