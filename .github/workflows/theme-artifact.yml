name: theme-artifact

# Checks the example disk themes under themes/ and packs them as a ready-to-copy THM/ folder.
on:
  push:
    branches: [rebuild/main, "claude/**"]
    paths:
      - 'themes/**'
      - '.github/scripts/test_disk_themes.py'
      - '.github/workflows/theme-artifact.yml'
  pull_request:
    paths:
      - 'themes/**'
      - '.github/scripts/test_disk_themes.py'
      - '.github/workflows/theme-artifact.yml'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check the themes against the theme engine rules
        run: python3 .github/scripts/test_disk_themes.py
      - name: Stage THM/ for copying to a device
        run: |
          mkdir -p stage/THM
          cp -r themes/thm_* stage/THM/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riptopl-theme-ps2classic
          path: stage/
          if-no-files-found: error
