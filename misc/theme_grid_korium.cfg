# FR #49's console (#System: PS1/PS2) and disc (#Media: CD/DVD) glyphs are NOT drawn on this theme's
# main page. The ENGINE still supports them everywhere -- any theme that wants them just declares
# AttributeImage elements, exactly as these did, and the info page below still shows #Media/#Format.
# They are only removed from OUR browse view, for two reasons:
#
#   1. VRAM. Two more textures resident for a badge this theme does not need, alongside the disc
#      icons already dropped for the same reason.
#   2. AND THE BIGGER ONE: they were the ONLY config-consuming elements in this family. An
#      AttributeImage sets needsItemConfig, and that flag is what makes the menu open
#      CFG/<game>.cfg on the game device for EVERY settled row -- measured on hardware at roughly
#      three storage operations per second while merely browsing, on the worker that outranks the
#      art thread and shares its one file channel. rebuild-155 gated that read on the flag; with
#      these two gone the flag is clear for coverflow's main page, so browsing this theme now issues
#      no per-row config read at all. That is the whole gate finally paying off on our own theme.
#
# Re-adding either element re-arms that read. That is a fair trade for a theme that displays them --
# it is not a fair trade for one that does not.
