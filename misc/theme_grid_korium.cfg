# Grid view of the built-in Korium theme, the same layout as misc/theme_grid.cfg (inceBtion) with
# Korium's own cases. Korium's case pictures are 256 by 256 canvases with the case in a corner, so the
# covers keep a cell of their own (cell_width, cell_height) and the engine fits each case's cover window,
# measured off the PNG as in Korium's conf_theme_OPL, into it. NO overlay2, as in Korium's other views.
# The rest as inceBtion has it, the Coverflow look with the covers in rows and columns
# (multi-view themes, idea by KrahJohlito). Pages of 4 x 2 full-size covers, 6 x 2 on a 16:9 picture
# (covers draw at 3/4 width there), as RIPPS2's RIPGRID lays them out (akilluminati47). The devices sit in
# a sidebar on the left (Left from the first column); a game with no cover shows its serial on a glass tile.
# No global colour keys: see thmLoad() in src/themes.c (#574).
font1=builtin
font1_size=20
main0:
	type=Background
	pattern=BG
main1:
	type=StaticImage
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
main2:
	type=Grid
	default=cover
	rows=2
	columns=4
	columns_hd=6
	spacing=24
	cell_width=100
	cell_height=140
	coverless=serial
	y=226
	width=256
	height=256
	overlay=case
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=20
	overlay_llx=0
	overlay_lly=242
	overlay_lrx=167
	overlay_lry=250
